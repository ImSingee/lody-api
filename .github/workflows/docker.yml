name: Docker

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: >-
        ${{ github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
             github.event.pull_request.user.login != 'dependabot[bot]' &&
             github.actor != 'dependabot[bot]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read source revision
        id: revision
        run: |
          commit_sha="$(git rev-parse HEAD)"
          commit_time="$(git show -s --format=%cI HEAD)"
          echo "commit=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "commit_time=$commit_time" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=${{ github.event_name == 'pull_request' && 'false' || 'auto' }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}},enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            LODY_API_BUILD_COMMIT=${{ steps.revision.outputs.commit }}
            LODY_API_BUILD_COMMIT_TIME=${{ steps.revision.outputs.commit_time }}
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
